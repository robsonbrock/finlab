<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrum Retro - Sala</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text x='32' y='32' font-size='36' font-weight='900' text-anchor='middle' dominant-baseline='middle' fill='%232563eb' font-family='monospace'>SR</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d1117; --panel:    #161b22; --toolbar:  #21262d;
      --hover:   #1f2937; --text:     #e6edf3; --muted:    #8b949e;
      --border:  #30363d; --accent:   #2563eb; --accent-h: #3b82f6;
      --ok:      #22c55e; --danger:   #ef4444; --column-bg: #161b22;
    }
    [data-theme="light"] {
      --bg:      #f3f1f0; --panel:    #ffffff; --toolbar:  #f0edec;
      --hover:   #e8e5e0; --text:     #2d2420; --muted:    #9c8f84;
      --border:  #e8e5e0; --accent:   #d97706; --accent-h: #b45309;
      --ok:      #15803d; --danger:   #dc2626; --column-bg: #e8e5e0;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    #header { background: var(--panel); border-bottom: 2px solid var(--border);
      padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .header-back { cursor: pointer; font-size: 16px; color: var(--accent); padding: 4px 8px;
      border-radius: 4px; transition: background .2s; }
    .header-back:hover { background: var(--hover); }
    .header-title { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .room-name { font-size: 16px; font-weight: 600; cursor: pointer; padding: 4px 8px;
      border-radius: 4px; transition: background .2s; }
    .room-name:hover { background: var(--hover); }
    .room-name.editing { background: var(--toolbar); }
    .room-name-input { padding: 4px 8px; background: var(--toolbar); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 14px; font-family: inherit; }
    .room-name-input:focus { outline: none; border-color: var(--accent); }
    .room-code { font-size: 12px; color: var(--muted); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-icon { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--toolbar);
      border-radius: 4px; cursor: pointer; color: var(--text); font-size: 14px; transition: all .2s; }
    .btn-icon:hover { border-color: var(--accent); background: var(--hover); }
    .btn-copy-code { font-size: 12px; padding: 4px 12px; }
    #content { flex: 1; display: flex; overflow: hidden; }
    #columns-container { display: flex; flex: 1; gap: 12px; padding: 12px; overflow-x: auto;
      overflow-y: hidden; background: var(--bg); width: 100%; }
    .column { background: var(--column-bg); border: 1px solid var(--border); border-radius: 6px;
      display: flex; flex-direction: column; min-width: 280px; flex: 1;
      height: calc(100vh - 100px); }
    .column-header { padding: 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .column-name { flex: 1; font-weight: 600; font-size: 13px; cursor: pointer;
      padding: 4px 6px; border-radius: 3px; transition: background .2s; }
    .column-name:hover { background: var(--hover); }
    .column-name.editing { background: var(--toolbar); }
    .column-name-input { flex: 1; padding: 4px 6px; background: var(--toolbar);
      border: 1px solid var(--border); border-radius: 3px; color: var(--text);
      font-size: 12px; font-family: inherit; font-weight: 600; }
    .column-name-input:focus { outline: none; border-color: var(--accent); }
    .column-actions { display: flex; gap: 4px; }
    .btn-color { width: 24px; height: 24px; border: 1px solid var(--border);
      border-radius: 3px; cursor: pointer; background: var(--toolbar); }
    .btn-delete { width: 24px; height: 24px; border: 1px solid var(--border);
      border-radius: 3px; cursor: pointer; background: transparent; color: var(--text);
      font-size: 12px; transition: all .2s; }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }
    .column-cards { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column;
      gap: 8px; }
    .card { background: var(--toolbar); border: 2px solid; border-radius: 12px; padding: 10px;
      font-size: 12px; line-height: 1.4; display: flex; flex-direction: column; gap: 6px;
      cursor: grab; transition: all .15s; background-color: var(--toolbar); }
    .card[data-col-color] { background-color: var(--toolbar) !important; }
    .card:active { cursor: grabbing; opacity: 0.8; }
    .card-text { flex: 1; word-break: break-word; resize: none; background: transparent;
      border: none; color: var(--text); outline: none; font-family: inherit; font-size: inherit; }
    .card-text:focus { outline: 1px solid var(--border); border-radius: 2px; padding: 2px; }
    .card-bottom { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .card-like { cursor: pointer; display: flex; align-items: center; gap: 3px;
      font-size: 12px; margin-left: auto; background: none; border: none; padding: 0; }
    .like-count { font-size: 10px; min-width: 12px; color: var(--muted); opacity: 0.8; }
    .card-delete { width: 20px; height: 20px; border: none; background: transparent;
      cursor: pointer; font-size: 12px; color: var(--muted); transition: color .15s; }
    .card-delete:hover { color: var(--danger); }
    .card-emojis { display: flex; gap: 3px; flex-wrap: wrap; font-size: 10px; }
    .btn-emoji { background: transparent; border: none; cursor: pointer; padding: 0;
      font-size: 12px; transition: opacity .15s; }
    .btn-emoji:hover { opacity: 0.7; }
    .column-add-card { padding: 8px; }
    .btn-add-card { width: 100%; padding: 6px; background: var(--toolbar); border: 1px dashed var(--border);
      border-radius: 3px; color: var(--muted); cursor: pointer; font-size: 12px;
      transition: all .2s; }
    .btn-add-card:hover { border-color: var(--accent); color: var(--accent); }
    .add-column-btn { padding: 12px; flex-shrink: 0; }
    .btn-add-column { padding: 8px 14px; background: var(--accent); border: none;
      border-radius: 4px; color: #fff; cursor: pointer; font-size: 12px; font-weight: 500;
      transition: background .2s; }
    .btn-add-column:hover { background: var(--accent-h); }
    #theme-toggle { position: fixed; bottom: 20px; right: 20px; width: 44px; height: 44px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px;
      transition: all .2s; z-index: 50; }
    #theme-toggle:hover { border-color: var(--accent); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 1000;
      display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      width: min(400px, 95vw); }
    .modal-header { padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-weight: 600; }
    .modal-body { padding: 16px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end; }
    .btn { padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border);
      cursor: pointer; font-size: 12px; font-weight: 500; transition: all .2s; outline: none; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-default { background: var(--toolbar); color: var(--text); }
    .btn-default:hover { background: var(--hover); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: 0.8; }
    @media (max-width: 768px) {
      #header { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; }
      .column { min-width: 200px; }
    }
  </style>
</head>
<body>

<div id="header">
  <div class="header-back">← Voltar</div>
  <div class="header-title">
    <div class="room-name" onclick="editRoomName()">Sala: <span id="roomNameSpan">Carregando...</span></div>
    <div class="room-code">Código: <strong id="roomCode">-</strong></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-copy-code" onclick="copyRoomCode()">Copiar código da sala</button>
    <div style="display: flex; align-items: center; gap: 8px;">
      <label for="sortSelect" style="font-size: 12px; color: var(--text);">Ordenar por</label>
      <select id="sortSelect" onchange="handleSortChange(this.value)" style="padding: 6px 12px; background: var(--toolbar); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 12px;">
        <option value="data-criacao">Data criação</option>
        <option value="votos">Votos</option>
      </select>
    </div>
    <button id="theme-toggle" title="Toggle tema">🌙</button>
  </div>
</div>

<div id="content">
  <div id="columns-container"></div>
  <div class="add-column-btn">
    <button class="btn-add-column" onclick="addColumn()">+ Coluna</button>
  </div>
</div>

<!-- Modal: Editar nome da sala -->
<div class="modal-overlay" id="editRoomModal">
  <div class="modal">
    <div class="modal-header">Editar Nome da Sala</div>
    <div class="modal-body">
      <input type="text" id="editRoomInput" class="column-name-input" placeholder="Nome da sala" maxlength="50">
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeEditRoom()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveRoomName()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Confirmação de deleção de coluna -->
<div class="modal-overlay" id="deleteColumnModal1">
  <div class="modal">
    <div class="modal-header">Deletar Coluna?</div>
    <div class="modal-body">Tem certeza que deseja deletar esta coluna?</div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeDeleteColumnModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDeleteColumn()">Deletar</button>
    </div>
  </div>
</div>

<!-- Modal: Segunda confirmação de deleção de coluna -->
<div class="modal-overlay" id="deleteColumnModal2">
  <div class="modal">
    <div class="modal-header">Confirmar Deleção</div>
    <div class="modal-body">Todos os dados da coluna serão perdidos. Deseja continuar?</div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeDeleteColumnModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="finalDeleteColumn()">Deletar Permanentemente</button>
    </div>
  </div>
</div>

<!-- Modal: Confirmação de deleção de card -->
<div class="modal-overlay" id="deleteCardModal">
  <div class="modal">
    <div class="modal-header">Deletar Card?</div>
    <div class="modal-body">Tem certeza que deseja deletar este card?</div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeDeleteCardModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDeleteCard()">Deletar</button>
    </div>
  </div>
</div>

<!-- Modal: Emoji Picker -->
<div class="modal-overlay" id="emojiPickerModal">
  <div class="modal">
    <div class="modal-header">Escolher Emoji</div>
    <div class="modal-body" id="emojiGrid" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 300px; overflow-y: auto;">
      <!-- Emojis serão adicionados dinamicamente -->
    </div>
  </div>
</div>

<script src="../shared/analytics.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/supabaseClient.js"></script>
<script src="js/repository.js"></script>
<script src="js/roomService.js"></script>
<script src="js/controller.js"></script>
</body>
</html>
